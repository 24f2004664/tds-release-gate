name: TDS Git Release Gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: TDS Identity: 24f2004664@ds.study.iitm.ac.in
        run: echo "TDS Identity: 24f2004664@ds.study.iitm.ac.in"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Test release gate
        run: |
          node --version
          echo "Release gate workflow executed successfully"